<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-label="Sem pôster disponível">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171C42"/>
      <stop offset="100%" stop-color="#0A0D24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E3B23C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E3B23C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="300" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="300" height="450" fill="url(#glow)"/>

  <!-- bobina de filme -->
  <g transform="translate(150,190)" fill="none" stroke="#E3B23C" stroke-width="3" opacity="0.9">
    <circle r="52"/>
    <circle r="9" fill="#E3B23C" stroke="none"/>
    <circle cx="0" cy="-34" r="10"/>
    <circle cx="29" cy="17" r="10"/>
    <circle cx="-29" cy="17" r="10"/>
    <circle cx="18" cy="-28" r="8" opacity="0.6"/>
    <circle cx="-18" cy="-28" r="8" opacity="0.6"/>
  </g>

  <!-- fita saindo da bobina -->
  <path d="M 150 246 C 130 280, 170 300, 150 335" fill="none" stroke="#E3B23C" stroke-width="3" opacity="0.55"/>

  <text x="150" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" letter-spacing="2" fill="#A6ABD4">
    SEM PÔSTER DISPONÍVEL
  </text>

  <!-- perfurações laterais, ecoando a moldura de 35mm -->
  <g fill="#E3B23C" opacity="0.35">
    <circle cx="16" cy="20" r="4"/><circle cx="16" cy="50" r="4"/><circle cx="16" cy="80" r="4"/>
    <circle cx="16" cy="370" r="4"/><circle cx="16" cy="400" r="4"/><circle cx="16" cy="430" r="4"/>
    <circle cx="284" cy="20" r="4"/><circle cx="284" cy="50" r="4"/><circle cx="284" cy="80" r="4"/>
    <circle cx="284" cy="370" r="4"/><circle cx="284" cy="400" r="4"/><circle cx="284" cy="430" r="4"/>
  </g>
</svg>
